<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Git</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .container {
            margin-top: 100px;
        }

        img {
            width: 100px;
            height: auto;
        }

        form {
            display: inline-block;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input[type="text"], input[type="password"] {
            width: 220px;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            margin-top: 15px;
            padding: 8px 20px;
            background-color: #f4511e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Coloca la imagen del logo en el mismo directorio del HTML -->
        <img src="login.png" alt="Git Logo">

        <form>
            <label for="username">User Name</label>
            <input type="text" id="username" name="username" placeholder="Write your user name here">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">

            <br>
            <input type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
